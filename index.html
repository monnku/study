<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico">
  <title>勉強ログ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Noto Sans JP -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-31KJXXHH1Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-31KJXXHH1Q');
  </script>
</head>
<body>

<div class="container">
  <h2>勉強ログ</h2>

  <div class="card">
    <div class="input-group">
      <div class="input-item">
        <label>科目</label>
        <select id="subjectSelect"></select>
      </div>
      <div class="input-item">
        <label>時間（分）</label>
        <input type="number" id="time" placeholder="例: 60">
      </div>
      <button class="btn-primary" onclick="addStudy()">記録を追加</button>
    </div>
  </div>

  <div class="layout-grid">
    <div class="side">
      <h3>科目管理</h3>
      <div class="subject-manage">
        <input type="text" id="newSubjectName" placeholder="新しい科目名">
        <button class="btn-outline" onclick="addNewSubject()">追加</button>
      </div>
      <ul id="subjectList" class="management-list"></ul>
    </div>

    <div class="main">
      <div class="flex-header">
        <h3>最近の記録</h3>
        <p id="total" class="total-badge"></p>
      </div>
      <ul id="logList" class="log-list"></ul>
      
      <div class="chart-container">
        <h3>学習状況</h3>
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
